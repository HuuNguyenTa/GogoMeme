<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    (() => {
      let theme;
      try { theme = localStorage.getItem('tram-yeu-thuong-theme-v1'); } catch {}
      if (theme !== 'day' && theme !== 'night') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
      }
      const root = document.documentElement;
      root.dataset.theme = theme;
      root.style.colorScheme = theme === 'night' ? 'dark' : 'light';
      root.style.backgroundColor = theme === 'night' ? '#11182d' : '#fffdf9';
    })();
  </script>
  <title>GoGo & MeMe</title>
  <meta name="description"
    content="Một lời chúc nhỏ. Một hành động yêu thương. Dự án cộng đồng nâng cao nhận thức về chó mèo bị bỏ rơi.">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff7e54'%3E%3Cpath d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/%3E%3C/svg%3E">

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>
<script type="module">
  // Respect the motion budget: cursor decoration is desktop/day-only.
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const pointer = matchMedia('(hover: hover) and (pointer: fine)');
  let cursor;
  const syncCursor = async () => {
    if (motion.matches || !pointer.matches || document.documentElement.dataset.theme === 'night') {
      cursor?.destroy();
      cursor = undefined;
      return;
    }
    if (cursor) return;
    try {
      const { bubbleCursor } = await import('https://unpkg.com/cursor-effects@latest/dist/esm.js');
      if (!motion.matches && pointer.matches && document.documentElement.dataset.theme !== 'night' && !cursor) cursor = new bubbleCursor();
    } catch { /* Cursor decoration is optional. */ }
  };
  motion.addEventListener('change', syncCursor);
  new MutationObserver(syncCursor).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  syncCursor();
</script>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
